<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Return California | Tending the Land</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --mist-cream: #F3EFE6;
            --bark: #2E312C;
            --redwood: #4E5A46;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: var(--bark);
            color: white;
            -webkit-font-smoothing: antialiased;
        }

        /* Background Video */
        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            overflow: hidden;
        }

        #bg-video {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: opacity 2s ease-in-out;
        }

        #bg-video.playing {
            opacity: 1;
        }

        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom,
                    rgba(46, 49, 44, 0.6) 0%,
                    rgba(46, 49, 44, 0.4) 50%,
                    rgba(46, 49, 44, 0.7) 100%);
            z-index: 2;
        }

        /* Navigation */
        nav {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 40px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            color: white;
            letter-spacing: 1px;
            font-weight: 400;
        }

        .nav-contact {
            color: white;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 300;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            border-bottom: 1px solid transparent;
            transition: all 0.3s ease;
        }

        .nav-contact:hover {
            border-bottom: 1px solid white;
            opacity: 0.8;
        }

        /* Hero */
        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            padding: 120px 20px 40px 20px;
            z-index: 5;
        }

        .hero-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
        }

        .hero h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(3.5rem, 8vw, 6.5rem);
            margin: 0 0 20px 0;
            color: white;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            font-weight: 400;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUp 1.5s forwards 0.5s ease-out;
        }

        .hero-tagline {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1.6rem, 3.5vw, 2.5rem);
            font-style: italic;
            color: var(--mist-cream);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            margin: 0 0 25px 0;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUp 1.5s forwards 0.8s ease-out;
        }

        .hero-subtitle {
            font-size: clamp(1.1rem, 2vw, 1.4rem);
            max-width: 650px;
            color: white;
            font-weight: 300;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            margin: 0;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUp 1.5s forwards 1.1s ease-out;
        }

        .hero-footer {
            opacity: 0;
            animation: fadeIn 2s forwards 1.5s ease-out;
        }

        .hero-footer p {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.4);
            margin: 0;
            letter-spacing: 0.5px;
        }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            nav {
                padding: 30px 20px;
            }

            .hero {
                padding-top: 100px;
            }
        }
    </style>
</head>

<body>

    <!-- Background Video -->
    <div class="video-container">
        <video autoplay muted loop playsinline id="bg-video">
            <source src="images/sunrise.mp4" type="video/mp4">
        </video>
        <div class="video-overlay"></div>
    </div>

    <!-- Minimal Nav -->
    <nav>
        <div class="logo">Return California</div>
        <a href="mailto:info@returncalifornia.org" class="nav-contact">Walk With Us</a>
    </nav>

    <!-- Main Content -->
    <main class="hero">
        <div class="hero-content">
            <h1>Return California</h1>
            <p class="hero-tagline">When we awake, we are in ceremony</p>
            <p class="hero-subtitle">The earth grounds us, the waters teach us, the fire transforms us, and the winds
                carry our voices.</p>
        </div>
        <div class="hero-footer">
            <p>&copy; 2026 Return California. A 508(c)PMA</p>
        </div>
    </main>

    <script>
        // Fade in background video once it is playing to avoid harsh flashing
        const video = document.getElementById('bg-video');
        if (video) {
            if (video.readyState >= 3) {
                video.classList.add('playing');
            } else {
                video.addEventListener('playing', () => {
                    video.classList.add('playing');
                });
            }
        }
    </script>
</body>

</html>
